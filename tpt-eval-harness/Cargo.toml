[package]
name = "tpt-eval-harness"
description = "Tools for running LLM eval datasets deterministically"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/tpt-eval-harness"
readme = "README.md"
keywords = ["eval", "benchmark", "llm", "harness", "testing"]
categories = ["development-tools", "asynchronous"]

[dependencies]
serde.workspace = true
serde_json.workspace = true

[features]
default = ["std", "json-sse"]
std = []
async = ["std"]
json-sse = []
