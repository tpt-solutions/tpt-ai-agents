[package]
name = "tpt-tokenizers-fast"
description = "Lightweight, no_std-compatible BPE/SentencePiece tokenization"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/tpt-tokenizers-fast"
readme = "README.md"
keywords = ["tokenizer", "bpe", "sentencepiece", "no-std", "llm"]
categories = ["text-processing", "parsing"]

[dependencies]
thiserror.workspace = true

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "tokenizer"
harness = false

[features]
default = ["std", "json-sse"]
std = []
async = ["std"]
json-sse = []
