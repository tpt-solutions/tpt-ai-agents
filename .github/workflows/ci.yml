name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-features --all-targets -D warnings

  test-stable:
    name: Tests (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all --all-features

  test-msrv:
    name: Tests (MSRV 1.75)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.75
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all

  no-std-check:
    name: "no_std check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check each crate with --no-default-features
        run: |
          for dir in tpt-llm-client-core tpt-vector-store-traits tpt-rag-pipeline \
                     tpt-tool-use-macros tpt-prompt-template tpt-onnx-runtime-utils \
                     tpt-tokenizers-fast tpt-agent-memory tpt-eval-harness tpt-ai-mock-server; do
            if [ -d "$dir" ]; then
              echo "Checking $dir --no-default-features"
              cargo check -p "$dir" --no-default-features
            fi
          done

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v1

  semver-checks:
    name: Semver Checks
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: obi1kenobi/cargo-semver-checks-action@v2

  publish-dry-run:
    name: Publish Dry Run
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Dry run publish for each crate
        run: |
          for dir in tpt-llm-client-core tpt-vector-store-traits tpt-rag-pipeline \
                     tpt-tool-use-macros tpt-prompt-template tpt-onnx-runtime-utils \
                     tpt-tokenizers-fast tpt-agent-memory tpt-eval-harness tpt-ai-mock-server; do
            if [ -d "$dir" ]; then
              echo "Dry run publish for $dir"
              cargo publish --dry-run -p "$dir"
            fi
          done
