name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml versions
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          for dir in tpt-prompt-template tpt-vector-store-traits tpt-onnx-runtime-utils \
                     tpt-tokenizers-fast tpt-tool-use-macros tpt-ai-mock-server \
                     tpt-llm-client-core tpt-embeddings-client tpt-agent-graph \
                     tpt-rag-pipeline tpt-agent-memory tpt-eval-harness \
                     tpt-vector-store-qdrant tpt-vector-store-pgvector; do
            VERSION=$(grep '^version' "$dir/Cargo.toml" | head -1 | sed 's/.*"\(.*\)".*/\1/')
            if [ "$VERSION" != "$TAG" ]; then
              echo "ERROR: $dir version ($VERSION) does not match tag ($TAG)"
              exit 1
            fi
          done
          echo "All crate versions match tag $TAG"

      - name: Publish Tier 0 crates
        run: |
          for crate in tpt-prompt-template tpt-vector-store-traits tpt-onnx-runtime-utils \
                       tpt-tokenizers-fast tpt-tool-use-macros tpt-ai-mock-server \
                       tpt-llm-client-core tpt-embeddings-client tpt-agent-graph; do
            echo "Publishing $crate..."
            cargo publish -p "$crate"
            echo "Waiting for crates.io index update..."
            sleep 30
          done

      - name: Publish Tier 1 crates
        run: |
          for crate in tpt-rag-pipeline tpt-agent-memory tpt-eval-harness tpt-vector-store-qdrant tpt-vector-store-pgvector; do
            echo "Publishing $crate..."
            cargo publish -p "$crate"
            echo "Waiting for crates.io index update..."
            sleep 30
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
