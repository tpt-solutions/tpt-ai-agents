[package]
name = "tpt-onnx-runtime-utils"
description = "High-level wrappers for local ONNX inference"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/tpt-onnx-runtime-utils"
readme = "README.md"
keywords = ["onnx", "inference", "ml", "tensor", "edge"]
categories = ["machine-learning", "memory-management"]

[dependencies.tract-onnx]
version = "0.23"
optional = true

[dev-dependencies]
prost = "0.11"

[features]
default = ["std", "json-sse"]
std = ["dep:tract-onnx"]
async = ["std"]
json-sse = []
