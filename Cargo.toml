[package]
name = "tpt-ai-agents-examples"
description = "Root workspace package hosting cross-crate examples/ (not published)"
publish = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[workspace]
resolver = "2"
members = [
    "tpt-llm-client-core",
    "tpt-vector-store-traits",
    "tpt-rag-pipeline",
    "tpt-tool-use-macros",
    "tpt-prompt-template",
    "tpt-onnx-runtime-utils",
    "tpt-tokenizers-fast",
    "tpt-agent-memory",
    "tpt-eval-harness",
    "tpt-ai-mock-server",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpt-solutions/tpt-ai-agents"
authors = ["TPT Solutions"]
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
tokio = { version = "1", default-features = false }
async-trait = "0.1"
thiserror = { version = "2", default-features = false }
futures = { version = "0.3", default-features = false }
bytes = "1"
pin-project-lite = "0.2"

criterion = { version = "0.5", features = ["html_reports"] }

[dev-dependencies]
tpt-rag-pipeline = { path = "tpt-rag-pipeline" }
tpt-agent-memory = { path = "tpt-agent-memory" }
tpt-llm-client-core = { path = "tpt-llm-client-core" }
tpt-tool-use-macros = { path = "tpt-tool-use-macros" }
tpt-ai-mock-server = { path = "tpt-ai-mock-server" }
tpt-vector-store-traits = { path = "tpt-vector-store-traits" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
