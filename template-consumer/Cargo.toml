[package]
name = "{{ project_name }}"
description = "{{ project_description }}"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
tpt-llm-client-core = { version = "0.1.0", features = ["std"] }
tpt-agent-memory = { version = "0.1.0", features = ["std"] }
tpt-tool-use-macros = "0.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
